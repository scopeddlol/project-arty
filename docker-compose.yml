# PROJECT: ARTY - WARDOGS Artillery Calculator.
#
#   docker compose up -d        # then open http://localhost:8080
#
# Map imagery and terrain data are not included. Put your own files in the
# map-assets folder next to this file (see docs/self-hosting.md#map-assets)
# and restart the container.
#
# Settings can be overridden in a .env file next to this one (see .env.example).
# Without a published image, `docker compose up -d --build` builds it locally.

services:
  arty:
    image: ghcr.io/scopeddlol/project-arty:latest
    build: .
    restart: unless-stopped
    ports:
      - "${ARTY_PORT:-8080}:8080"
    volumes:
      - ${ARTY_ASSETS_DIR:-./map-assets}:/srv/arty-assets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
