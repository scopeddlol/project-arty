# PROJECT: ARTY site configuration (included from nginx.conf).
#
# Map tiles and Terrain3D data are never bundled in the image. The admin
# provides them in the map-assets folder, mounted read-only at
# /srv/arty-assets (see docs/self-hosting.md#map-assets).

# Fingerprinted JS/CSS are requested with ?v=<build hash> and never change.
map $arg_v $arty_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects keep /mobile -> /mobile/ working behind port
    # mappings and reverse proxies.
    absolute_redirect off;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Written at startup by /docker-entrypoint.d/40-arty-assets.sh.
    location = /assets-status.json {
        alias /tmp/assets-status.json;
        default_type application/json;
        add_header_inherit merge;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header_inherit merge;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|mjs|css)$ {
        add_header_inherit merge;
        add_header Cache-Control $arty_static_cache always;
    }

    location ~* \.(?:png|webp|svg|ico|jpe?g|gif)$ {
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Admin-supplied map imagery. ^~ keeps the image regex above from
    # looking for tiles inside the application directory.
    location ^~ /maps/tiles/ {
        root /srv/arty-assets;
        log_not_found off;
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /maps/tiles-color/ {
        root /srv/arty-assets;
        log_not_found off;
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Admin-supplied Terrain3D manifests and chunks, falling back to the
    # contour overlays that ship with the application.
    location ^~ /data/terrain/ {
        root /srv/arty-assets;
        try_files $uri @arty_app;
        log_not_found off;
        add_header_inherit merge;
        add_header Cache-Control "no-cache" always;
    }

    location @arty_app {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
